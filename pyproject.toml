[project]
name = "zamline-backend"
version = "0.2.0"
description = "ZamLine freight coordination and decision-support backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.6",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "httpx>=0.28",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
